[package]
name = "task_scheduler"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["json", "macros", "tokio", "tracing"] }
tokio = { version = "1.51.1", features = ["macros", "rt", "rt-multi-thread", "time"] }
tracing = "0.1.44"
sqlx = { version = "0.8", features = [ "runtime-tokio", "postgres", "chrono", "uuid" ] }
anyhow = "1.0.102"
uuid = { version = "1.23.0", features = ["v4", "serde"] }
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
futures-util = "0.3.32"
serde = "1.0.228"
http = "1.4.0"
serde_json = "1.0.149"
sha2 = "0.11.0"
base64 = "0.22.1"
reqwest = "0.13.2"
rand = "0.10.1"

[dev-dependencies]
proptest-derive = "0.8.0"
proptest = "1.11.0"